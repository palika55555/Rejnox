# Codemagic: Rejnox pre iPhone + Apple Watch → TestFlight.
#
# Pred prvým zostavením (raz):
# 1. developer.apple.com → Identifiers: pri com.rejnox.rejnox aj
#    com.rejnox.rejnox.watchkitapp zapni schopnosť HealthKit
#    (ak watchkitapp ešte neexistuje, vytvor ho ako App ID).
# 2. Codemagic → Team settings → Integrations → Developer Portal:
#    pridaj App Store Connect API kľúč s názvom "Rejnox".
# 3. Codemagic → aplikácia → Environment variables: skupina "rejnox_signing"
#    s premennou CERTIFICATE_PRIVATE_KEY (súkromný RSA kľúč certifikátu,
#    označ ako Secure), APP_STORE_APPLE_ID (číselné ID appky v App Store Connect)
#    a API_URL (adresa API na Cloudflare, napr. https://rejnox.sk/api).
#
# Workflow ios-sideload (bez platenej Apple Developer účtu a bez App Store
# Connect kľúča): zostaví nepodpísanú .ipa, stiahneš ju z Artifacts a podpíšeš
# v Sideloadly svojím Apple ID. Adresa API je v premennej API_URL nižšie,
# v Codemagicu sa nič nastavovať nemusí.
workflows:
  ios-sideload:
    name: iOS → nepodpísaná IPA (Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Verejná adresa API (nie je tajná), preto je priamo tu.
        API_URL: https://rejnox.sk/api
    scripts:
      - name: Balíčky
        script: flutter pub get

      - name: Zostavenie nepodpísanej IPA
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_URL="$API_URL"
          mkdir -p build/ios/ipa Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry build/ios/ipa/Rejnox-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa

  ios-watch-testflight:
    name: iOS + Apple Watch → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Rejnox
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - rejnox_signing
    scripts:
      - name: Balíčky
        script: flutter pub get

      - name: Pridať aplikáciu pre Apple Watch do projektu
        script: |
          gem list xcodeproj -i >/dev/null || gem install xcodeproj
          ruby scripts/ios/add_watch_target.rb

      - name: Podpisovanie (iPhone + hodinky)
        script: |
          app-store-connect fetch-signing-files com.rejnox.rejnox \
            --type IOS_APP_STORE --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files com.rejnox.rejnox.watchkitapp \
            --type IOS_APP_STORE --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Zostavenie IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          # API_URL (napr. https://rejnox.sk/api) je premenná v skupine rejnox_signing.
          flutter build ipa --release \
            --dart-define=API_URL="${API_URL:?Chýba API_URL v Codemagic (skupina rejnox_signing)}" \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
